services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace/web
    ports:
      - "3000:3000"
    volumes:
      - ./Cargo.toml:/workspace/Cargo.toml:ro
      - ./Cargo.lock:/workspace/Cargo.lock:ro
      - ./crates:/workspace/crates:ro
      - ./web:/workspace/web
      - web_node_modules:/workspace/web/node_modules
      - cargo_registry:/root/.cargo/registry
      - cargo_git:/root/.cargo/git
      - cargo_target:/workspace/target
    environment:
      NODE_ENV: development
      NUXT_TELEMETRY_DISABLED: "1"
    init: true

volumes:
  web_node_modules:
  cargo_registry:
  cargo_git:
  cargo_target:
