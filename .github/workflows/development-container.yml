name: Development container

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/development-container.yml"
      - ".dockerignore"
      - "Dockerfile.dev"
      - "compose.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
  pull_request:
    paths:
      - ".github/workflows/development-container.yml"
      - ".dockerignore"
      - "Dockerfile.dev"
      - "compose.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-development-image:
    name: Build development container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build development image
        run: docker build --file Dockerfile.dev --tag design-platform-dev-ci .
      - name: Verify development container startup dependencies
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace/web \
            design-platform-dev-ci \
            sh -lc 'cd /workspace && cargo metadata --locked --format-version 1 > /dev/null && cd /workspace/web && corepack enable && corepack prepare pnpm@10.11.0 --activate && pnpm install --frozen-lockfile && pnpm run build:wasm'
