name: Dependency security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit locked Rust dependencies
        run: cargo audit --deny warnings

  frontend-audit:
    name: Production JavaScript dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Experimental toolchain comparison only. Keep pnpm 10.11.0 and the
      # frozen dependency graph as the required production security gate.
      # pnpm 12 normally follows packageManager's 10.x pin; --pm-on-fail=ignore
      # ensures the diagnostic actually executes version 12.21.0.
      - name: Compare pnpm 12.21.0 production audit (informational)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_version="$(npm exec --yes --package=pnpm@12.21.0 -- pnpm --pm-on-fail=ignore --version)"
          echo "Diagnostic pnpm version: ${diagnostic_version}"
          test "${diagnostic_version}" = "12.21.0"
          npm exec --yes --package=pnpm@12.21.0 -- pnpm --pm-on-fail=ignore audit --prod --audit-level high
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
