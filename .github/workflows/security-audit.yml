name: Dependency security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit locked Rust dependencies
        run: cargo audit --deny warnings

  frontend-audit:
    name: Production JavaScript dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify temporary security-exception guard
        run: node --test ../scripts/tests/temporary-security-audit.test.mjs
      - name: Audit production dependencies
        run: node ../scripts/temporary-security-audit.mjs
