name: Bootstrap pnpm lockfile (temporary)

on:
  push:
    branches:
      - codex/bootstrap-pnpm-lockfile

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-pnpm-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false
      - name: Generate deterministic lockfile
        working-directory: web
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile to this bootstrap branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already matches the branch."
            exit 0
          fi
          git commit -m "build: add pnpm lockfile"
          git push origin HEAD:codex/bootstrap-pnpm-lockfile
