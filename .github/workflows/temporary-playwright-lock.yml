name: Temporary Playwright lockfile bootstrap

on:
  push:
    branches: [test/cross-browser-export-regression]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/cross-browser-export-regression
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - name: Generate lockfile
        working-directory: web
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/pnpm-lock.yaml
          git commit -m "build: update pnpm lockfile for Playwright"
          git push
