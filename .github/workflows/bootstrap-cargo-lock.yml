name: Bootstrap Rust workspace lockfile

on:
  push:
    branches:
      - automation/cargo-lock-bootstrap

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate the real workspace lockfile
        run: cargo generate-lockfile
      - name: Verify locked dependency resolution
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Check WebAssembly adapter
        run: cargo check -p design-wasm --target wasm32-unknown-unknown --locked
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/bootstrap-cargo-lock.yml
          git commit -m "build: lock Rust workspace dependencies"
          git push
