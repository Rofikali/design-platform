name: Bootstrap node-forge security update

on:
  push:
    branches: [security/update-node-forge]

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/update-node-forge
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
          run_install: false
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Validate frozen install
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Commit generated lockfile and remove bootstrap workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/pnpm-lock.yaml .github/workflows/bootstrap-node-forge.yml
          git commit -m "build: lock patched node-forge dependency"
          git push
