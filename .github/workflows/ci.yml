name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  milestone-docs:
    name: Milestone documentation sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      - name: Verify milestone generator safeguards
        run: node --test scripts/tests/sync-milestone-docs.test.mjs
      - name: Reject stale generated milestone sections
        run: node scripts/sync-milestone-docs.mjs --check

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Check WebAssembly adapter
        run: cargo check -p design-wasm --target wasm32-unknown-unknown --locked

  frontend:
    name: Nuxt frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
          run_install: false
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Build the WASM adapter once. pnpm run typecheck/test/build each invoke
      # their pre-hooks, which would otherwise repeat this expensive compile.
      - name: Build WASM adapter
        run: pnpm run build:wasm
      - name: Type check
        run: pnpm exec nuxt typecheck
      - name: Run frontend tests
        run: pnpm exec vitest run
      - name: Run real-browser WASM smoke test
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: pnpm run test:wasm-browser
      - name: Run real Nuxt editor import/export browser test
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: pnpm run test:editor-browser
      # Informational only: inspect the .output/server generated by the
      # existing editor browser build. Does not replace the required audit,
      # establish exploitability, or trigger a new expensive build.
      - name: Inspect production Nuxt server bundle indicators
        run: |
          node ../scripts/inspect-nuxt-server-bundle.mjs .output/server
          node --test ../scripts/tests/inspect-nuxt-server-bundle.test.mjs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production Docker image
        run: >-
          docker buildx build
          --file ../Dockerfile
          --tag design-platform-ci
          --load
          --cache-from type=gha,scope=design-platform-production
          --cache-to type=gha,scope=design-platform-production,mode=max
          ..
