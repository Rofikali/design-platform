name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Check WebAssembly adapter
        run: cargo check -p design-wasm --target wasm32-unknown-unknown

  frontend:
    name: Nuxt frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Run frontend tests
        run: pnpm test
      - name: Run real-browser WASM smoke test
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: pnpm run test:wasm-browser
      - name: Run real Nuxt editor import/export browser test
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: pnpm run test:editor-browser
      - name: Build
        run: pnpm run build
      - name: Build Docker image
        run: docker build --file ../Dockerfile --tag design-platform-ci ..
      - name: Build Docker development image
        run: docker build --file ../Dockerfile.dev --tag design-platform-dev-ci ..
