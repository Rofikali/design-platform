<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Design WASM browser smoke</title></head>
<body>
  <main id="result" data-status="running">Running WebAssembly smoke tests…</main>
  <script type="module">
    const result = document.querySelector("#result");
    try {
      const wasm = await import("/web/generated/design-wasm/design_wasm.js");
      await wasm.default();

      const fixtureResponse = await fetch("/fixtures/document-v1.json");
      if (!fixtureResponse.ok) throw new Error("Could not load shared document fixture");
      const fixture = await fixtureResponse.text();
      const canonical = wasm.validate_document_json(fixture);
      const parsed = JSON.parse(canonical);
      if (parsed.schema_version !== 1 || !Array.isArray(parsed.elements) || parsed.elements.length !== 2) {
        throw new Error("Valid fixture did not produce the expected canonical document");
      }

      let malformedRejected = false;
      try { wasm.validate_document_json("{broken"); } catch { malformedRejected = true; }
      if (!malformedRejected) throw new Error("Malformed JSON was accepted");

      const invalidDocument = JSON.stringify({ ...parsed, schema_version: 999 });
      let invalidRejected = false;
      try { wasm.validate_document_json(invalidDocument); } catch { invalidRejected = true; }
      if (!invalidRejected) throw new Error("Unsupported schema version was accepted");

      let oversizedRejected = false;
      try { wasm.validate_document_json(" ".repeat(2_000_001)); } catch { oversizedRejected = true; }
      if (!oversizedRejected) throw new Error("Oversized UTF-8 input was accepted");

      result.dataset.status = "passed";
      result.textContent = "PASS: WASM initialized; valid fixture canonicalized; malformed, invalid-schema, and oversized inputs rejected.";
    } catch (error) {
      result.dataset.status = "failed";
      result.textContent = "FAIL: " + (error instanceof Error ? error.message : String(error));
    }
  </script>
</body>
</html>
