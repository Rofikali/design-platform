<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Design WASM browser smoke</title></head>
<body>
  <main id="result" data-status="running">Running WebAssembly smoke tests…</main>
  <script type="module">
    const result = document.querySelector("#result");
    try {
      const wasm = await import("/web/generated/design-wasm/design_wasm.js");
      await wasm.default();

      const casesResponse = await fetch("/fixtures/validation-cases-v1.json");
      if (!casesResponse.ok) throw new Error("Could not load shared validation cases");
      const casesFixture = await casesResponse.json();
      if (casesFixture.schema_version !== 1 || !Array.isArray(casesFixture.cases)) {
        throw new Error("Shared validation cases have an unsupported fixture version");
      }

      for (const testCase of casesFixture.cases) {
        let accepted = true;
        try {
          const canonical = wasm.validate_document_json(JSON.stringify(testCase.document));
          JSON.parse(canonical);
        } catch {
          accepted = false;
        }
        if (accepted !== testCase.valid) {
          throw new Error("WASM validation outcome differed for shared case: " + testCase.name);
        }
      }

      let malformedRejected = false;
      try { wasm.validate_document_json("{broken"); } catch { malformedRejected = true; }
      if (!malformedRejected) throw new Error("Malformed JSON was accepted");

      // 1,000,001 copies of é exceed the limit in UTF-8 bytes (2,000,002 bytes),
      // while remaining below the same limit when counted as JavaScript characters.
      let oversizedUtf8Rejected = false;
      try { wasm.validate_document_json("é".repeat(1_000_001)); } catch { oversizedUtf8Rejected = true; }
      if (!oversizedUtf8Rejected) throw new Error("Oversized UTF-8 input was accepted");

      // Execute the staged raster boundary in actual Chrome/WASM, rather than
      // treating Rust unit tests or mirrored TypeScript fixtures as browser proof.
      const rasterCases = [
        ["valid PNG signature", "data:image/png;base64,iVBORw0KGgo=", true],
        ["MIME mismatch", "data:image/jpeg;base64,iVBORw0KGgo=", false],
        ["noncanonical pad bits", "data:image/png;base64,iVBORw0KGgp=", false],
        ["missing padding", "data:image/png;base64,iVBORw0KGgo", false],
        ["invalid alphabet", "data:image/png;base64,!!!!", false],
        ["empty payload", "data:image/png;base64,", false],
        ["SVG not supported", "data:image/svg+xml;base64,iVBORw0KGgo=", false],
        ["remote URL not supported", "https://example.com/image.png", false],
        ["literal escape sequence", "data:image/png;base64,iVBORw0KGgo=\\\\n", false],
      ];
      for (const [name, input, expected] of rasterCases) {
        let accepted = true;
        try { wasm.validate_foreground_raster_data_url_v6(input); }
        catch { accepted = false; }
        if (accepted !== expected) {
          throw new Error("WASM foreground raster boundary differed for: " + name);
        }
      }

      const styleResponse = await fetch("/fixtures/text-style-v1-cases.json");
      if (!styleResponse.ok) throw new Error("Missing typography fixture");
      for (const entry of await styleResponse.json()) {
        let accepted = true;
        let normalized;
        try { normalized = JSON.parse(wasm.validate_text_style_v1_json(JSON.stringify(entry.input))); }
        catch { accepted = false; }
        if (accepted !== entry.valid || (accepted && JSON.stringify(normalized) !== JSON.stringify(entry.input))) {
          throw new Error("WASM typography style differed for: " + entry.name);
        }
      }
      const legacyResponse = await fetch("/fixtures/document-v1.json");
      if (!legacyResponse.ok) throw new Error("Missing legacy document fixture");
      const legacy = await legacyResponse.json();
      const styled = JSON.parse(wasm.normalize_typography_document_json(JSON.stringify(legacy)));
      if (styled.schema_version !== 7 || styled.text_styles.length !== 1 ||
          styled.text_styles[0].element_id !== "title-1" || styled.text_styles[0].style.font_family !== "sans") {
        throw new Error("WASM typography migration did not preserve default text binding");
      }
      styled.text_styles[0].style = { font_family: "serif", font_weight: "bold", font_style: "italic" };
      const roundtrip = JSON.parse(wasm.normalize_typography_document_json(JSON.stringify(styled)));
      if (JSON.stringify(roundtrip) !== JSON.stringify(styled)) throw new Error("Styled document roundtrip changed");
      for (const invalid of [
        { ...styled, text_styles: null }, { ...styled, text_styles: [] },
        { ...styled, text_styles: [styled.text_styles[0], styled.text_styles[0]] },
        { ...styled, text_styles: [{ ...styled.text_styles[0], element_id: "rect-2" }] },
        { ...styled, schema_version: 6 },
      ]) {
        let rejected = false;
        try { wasm.normalize_typography_document_json(JSON.stringify(invalid)); } catch { rejected = true; }
        if (!rejected) throw new Error("WASM accepted invalid typography document");
      }

      result.dataset.status = "passed";
      result.textContent = "PASS: WASM initialized; document fixtures, malformed/oversized JSON staged foreground raster and typography acceptance matrices passed.";
    } catch (error) {
      result.dataset.status = "failed";
      result.textContent = "FAIL: " + (error instanceof Error ? error.message : String(error));
    }
  </script>
</body>
</html>
